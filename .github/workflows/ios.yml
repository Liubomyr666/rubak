name: Build BLEP MAP IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and build BLEP MAP
        run: |
          set -e

          PROJECT="$(find . -type d -name 'BLEPMap.xcodeproj' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "BLEPMap.xcodeproj not found"
            exit 1
          fi

          echo "Found project: $PROJECT"

          rm -rf build Payload BLEP_MAP_ALTSTORE_FIXED.ipa

          xcodebuild \
            -project "$PROJECT" \
            -scheme BLEPMap \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP="$PWD/build/Build/Products/Release-iphoneos/BLEPMap.app"

          if [ ! -d "$APP" ]; then
            echo "BLEPMap.app was not created"
            exit 1
          fi

          echo "Removing old signatures..."
          find "$APP" -type d -name "_CodeSignature" -prune -exec rm -rf {} + || true

          echo "Ad-hoc signing embedded frameworks..."
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type d -name "*.framework" -print0 | while IFS= read -r -d '' FW; do
              codesign --force --sign - "$FW"
            done

            find "$APP/Frameworks" -type f -name "*.dylib" -print0 | while IFS= read -r -d '' DYLIB; do
              codesign --force --sign - "$DYLIB"
            done
          fi

          echo "Ad-hoc signing app..."
          codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$APP"

          echo "Checking signature..."
          codesign -dv --verbose=4 "$APP" 2>&1

          mkdir Payload
          cp -R "$APP" Payload/BLEPMap.app

          /usr/bin/zip -qry BLEP_MAP_ALTSTORE_FIXED.ipa Payload

          echo "IPA READY:"
          ls -lh BLEP_MAP_ALTSTORE_FIXED.ipa

      - name: Upload fixed IPA
        uses: actions/upload-artifact@v4
        with:
          name: BLEP_MAP_ALTSTORE_FIXED
          path: BLEP_MAP_ALTSTORE_FIXED.ipa
          if-no-files-found: error
