name: Build BLEP MAP IPA - AltStore Compatible

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Find and build BLEP MAP
        run: |
          set -e

          PROJECT="$(find . -type d -name 'BLEPMap.xcodeproj' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: BLEPMap.xcodeproj not found"
            exit 1
          fi

          echo "Project: $PROJECT"

          rm -rf build Payload BLEP_MAP_ALTSTORE_COMPAT.ipa

          xcodebuild \
            -project "$PROJECT" \
            -scheme BLEPMap \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS="-Wl,-ld_classic" \
            build

          APP="$PWD/build/Build/Products/Release-iphoneos/BLEPMap.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: BLEPMap.app not found"
            exit 1
          fi

          echo "=== APP INFO ==="
          /usr/bin/plutil -p "$APP/Info.plist"

          echo "=== EXECUTABLE ==="
          file "$APP/BLEPMap"

          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"

          mkdir Payload
          cp -R "$APP" Payload/BLEPMap.app

          /usr/bin/zip -qry BLEP_MAP_ALTSTORE_COMPAT.ipa Payload

          echo "IPA READY:"
          ls -lh BLEP_MAP_ALTSTORE_COMPAT.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BLEP_MAP_ALTSTORE_COMPAT
          path: BLEP_MAP_ALTSTORE_COMPAT.ipa
          if-no-files-found: error
