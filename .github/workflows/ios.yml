name: Build BLEP MAP IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build BLEP MAP
        run: |
          rm -rf build Payload BLEP_MAP_ALTSTORE.ipa

          xcodebuild \
            -project BLEPMap.xcodeproj \
            -scheme BLEPMap \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BLEPMap.app Payload/BLEPMap.app

          zip -qry BLEP_MAP_ALTSTORE.ipa Payload

          ls -lh BLEP_MAP_ALTSTORE.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BLEP_MAP_ALTSTORE_IPA
          path: BLEP_MAP_ALTSTORE.ipa
          if-no-files-found: error
